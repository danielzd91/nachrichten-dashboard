name: Dashboard bauen und verschlüsselt veröffentlichen

on:
  schedule:
    # Zwei Auslöser je Stunde (Minute 7 und 37), damit ein ausgefallener oder stark verspäteter Auslöser
    # kaum auffällt: GitHub garantiert geplante Läufe nicht. Gebaut wird trotzdem höchstens etwa einmal je
    # Stunde, weil der Job "zeitfenster" Läufe überspringt, wenn die Seite vor weniger als 40 Minuten
    # veröffentlicht wurde. cron gilt in UTC ohne Sommerzeit; deshalb laufen die UTC-Stunden 4 bis 19, und
    # derselbe Job lässt nur Läufe zwischen 06:00 und 20:59 Uhr deutscher Zeit durch.
    - cron: "7,37 4-19 * * *"
  push:                       # jede Änderung an Skript, Quellen oder Workflow baut die Seite sofort neu
    branches: [main, master]
    paths:
      - dashboard.R
      - quellen.yaml
      - .staticrypt.json
      - .github/workflows/dashboard.yml
  workflow_dispatch:          # zusätzlich von Hand startbar (Reiter Actions -> Run workflow)

permissions:
  contents: read
  deployments: read      # letzte Veröffentlichung abfragen (zeitfenster)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Europe/Berlin         # sonst zeigt das Dashboard Uhrzeiten in UTC

jobs:
  zeitfenster:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      aktiv: ${{ steps.pruefen.outputs.aktiv }}
    steps:
      - name: Zeitpunkt der letzten Veröffentlichung abfragen
        id: letzte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Schlägt die Abfrage fehl oder gibt es noch keine Veröffentlichung, bleibt der Wert leer: dann wird gebaut.
          ts=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" --jq '.[0].created_at // empty' 2>/dev/null || true)
          echo "ts=$ts" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob gebaut werden soll
        id: pruefen
        env:
          EREIGNIS: ${{ github.event_name }}
          LETZTE: ${{ steps.letzte.outputs.ts }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import calendar, datetime as dt, os, sys
          jetzt = dt.datetime.now(dt.timezone.utc)
          if os.environ.get("JETZT_UTC"):                       # nur für Tests
              jetzt = dt.datetime.fromisoformat(os.environ["JETZT_UTC"]).replace(tzinfo=dt.timezone.utc)
          def letzter_sonntag(jahr, monat):
              ende = dt.datetime(jahr, monat, calendar.monthrange(jahr, monat)[1], 1, tzinfo=dt.timezone.utc)
              return ende - dt.timedelta(days=(ende.weekday() + 1) % 7)
          # Sommerzeit: letzter Sonntag im März bis letzter Sonntag im Oktober, jeweils 01:00 UTC
          sommer = letzter_sonntag(jetzt.year, 3) <= jetzt < letzter_sonntag(jetzt.year, 10)
          lokal = jetzt + dt.timedelta(hours=2 if sommer else 1)
          ereignis = os.environ.get("EREIGNIS", "")
          aktiv = True
          grund = "kein geplanter Lauf: immer bauen"
          if ereignis == "schedule":
              if not 6 <= lokal.hour <= 20:
                  aktiv, grund = False, "außerhalb 06:00 bis 20:59 Uhr"
              else:
                  grund = "im Zeitfenster"
                  letzte = os.environ.get("LETZTE", "").strip()
                  if letzte:
                      try:
                          alter = jetzt - dt.datetime.fromisoformat(letzte.replace("Z", "+00:00"))
                          minuten = alter.total_seconds() / 60
                          if minuten < 40:
                              aktiv, grund = False, f"Seite ist erst {minuten:.0f} Minuten alt"
                          else:
                              grund = f"Seite ist {minuten:.0f} Minuten alt"
                      except ValueError:
                          grund = "Zeitstempel nicht lesbar: bauen"
          print(f"Ereignis {ereignis}, deutsche Zeit {lokal:%H:%M}: {grund} -> aktiv: {aktiv}", file=sys.stderr)
          print(f"aktiv={'true' if aktiv else 'false'}")
          PY

  build:
    needs: zeitfenster
    if: needs.zeitfenster.outputs.aktiv == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Projekt laden
        uses: actions/checkout@v6

      - name: R einrichten
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true      # fertig gebaute Pakete: Installation in Sekunden statt Minuten

      - name: R-Pakete installieren
        run: Rscript -e 'install.packages(c("httr", "curl", "xml2", "yaml", "dplyr", "purrr", "htmltools"))'

      - name: Dashboard erzeugen
        run: Rscript dashboard.R --no-open

      - name: Seite verschlüsseln
        env:
          STATICRYPT_PASSWORD: ${{ secrets.DASHBOARD_PASSWORT }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "Das Secret DASHBOARD_PASSWORT fehlt (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          # .staticrypt.json enthält das (nicht geheime) Salz; es bleibt gleich, damit "Auf diesem Gerät merken"
          # nach der täglichen Neuerstellung weiter funktioniert.
          npx --yes staticrypt@3 dashboard.html -d public --remember 30 --short \
            --template-title "Nachrichten" \
            --template-button "Öffnen" \
            --template-placeholder "Passwort" \
            --template-remember "Auf diesem Gerät merken" \
            --template-error "Falsches Passwort" \
            --template-color-primary "#1f2937" \
            --template-color-secondary "#e8edf2"
          mv public/dashboard.html public/index.html

      - name: Seite zum Veröffentlichen bereitstellen
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
